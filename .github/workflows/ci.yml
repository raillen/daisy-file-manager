name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

  build:
    name: Build Native Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile standalone binaries
        run: bun run build

      - name: Smoke test glibc binary
        run: |
          ./dist/daisy-linux-x64 --version
          ./dist/daisy-linux-x64 --help

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: daisy-binaries
          path: dist/
          if-no-files-found: error
